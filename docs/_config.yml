theme: jekyll-theme-slate
title: Waterloo Region Votes
description: Information About the 2022 Municipal Election
show_downloads: false
plugins:
  - jekyll-sitemap

include:
  - worksheets

# Make Github Pages stop compressing :nth-child(1 of .cell) to 
#   :nth-child(1of.cell)
sass:
  style: expanded

defaults:
  -
   values:
     layout: "default"

# For Youtube and other video embeds
embed-media: true

# Enable map searchbars. Generally one should be enabled 
# and one should be disabled.
enable-map-search-nominatim: false
enable-map-search-photon: true 

# Used for centering the map in show-map.js
map:
  # Use longitude, latitude as order even though this is backwards
  center:
    - -80.51511
    - 43.45850
  bbox:
    - -80.7907
    - 43.2281
    - -80.0834
    - 43.6032


empty-array: []

google_calendar_id: gnjujonnivepneq5mikitis6ms@group.calendar.google.com

google_calendar_timezone: America/Toronto
timezone: America/Toronto

google_calendar_rss: 'https://feeds.off-topic.kwlug.org/feeds/wrv-events.rss'

#google_analytics: UA-102439664-2
google_analytics: G-N6Y15Y5FRN

contact_email: "civictechwr.wrvotes@gmail.com"

# events_newsletter: "https://off-topic.kwlug.org/mailman/listinfo/waterlooregionvotes-events_off-topic.kwlug.org"

election_over: false

# Use ISO notation. This is used by countdown.js
election_date: "2022-10-24T09:00"

# This should be a number strictly greater than the number of votes
# received by any candidate in any race. 
big_number: 10000000
